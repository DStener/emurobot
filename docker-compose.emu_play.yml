services:
  emu_play:
    build: .
    command: emu_play
    privileged: true
    ports:
      - 7000:7000
    environment:
      - HOST_HOSTNAME=${HOSTNAME}
      - EMU_SIGNAL_ADDRESS=:7000
      - EMU_CONFIG_PATH=/app/example_config.yaml
      - EMU_DUMPS_DIR=/app/dumps
    volumes:
      - ./:/app:rw  
      - /dev:/dev:rw
    camera-bridge:
      build: ./camera_bridge
      container_name: camera-bridge
      restart: always
      privileged: true
      volumes:
      - /dev:/dev
      - /lib/modules:/lib/modules:ro
      command:
      - -hide_banner
      - -loglevel
      - warning
      - -f
      - v4l2
      - -framerate
      - "5"
      - -video_size
      - 640x480
      - -i
      - /dev/video0
      - -vf
      - format=yuyv422
      - -vcodec
      - rawvideo
      - -pix_fmt
      - yuyv422
      - -f
      - v4l2
      - /dev/video10
    