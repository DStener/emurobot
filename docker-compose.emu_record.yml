services:

  # Just create device for simulate real Serial-port 
  # with random output and 9600 b/s speed
  sim_dev:
    build: .
    command: sim_dev
    privileged: true
    environment:
      - DEVICE_COUNT=1
      - DEFAULT_SPEED=9600
      - TIME_DILATION=200 # for debug
    volumes:
      - /dev:/dev:rw
  emu_record:
    build: .
    command: emu_record
    privileged: true
    ports:
      - 7000:7000
    environment:
       - EMU_SIGNAL_ADDRESS=:7000
       - EMU_CONFIG_PATH=/app/example_config.yaml
       - EMU_DUMPS_DIR=/app/dumps
       - CAMERA_RECORDER_URL=http://camera-recorder:8080
    depends_on:
       - sim_dev
       - camera-recorder
    volumes:
       - ./:/app:rw
       - /dev:/dev:rw 
  camera-recorder:
    build: ./camera_recorder
    container_name: camera-recorder
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - /dev:/dev
      - ./recordings:/recordings
